  #   ports:
  #     - "3002:3002"
  #   environment:
  #     DB_HOST: db
  #     DB_PORT: 5432
  #     DB_USER: spi-simulator
  #     DB_PASSWORD: spi-simulator
  #     DB_NAME: spi-simulator
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   healthcheck:
  #     test:
  #       [
  #         "CMD-SHELL",
  #         "curl -sf http://localhost:3002/spi-simulator/health || exit 1",
  #       ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 15s

  kong:
    image: kong:3.9.1
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./docker/kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      orbe-ledger:
        condition: service_healthy
      orbe-services:
        condition: service_healthy
