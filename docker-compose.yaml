name: orbe-ledger
services:
  db:
    container_name: orbe-ledger-db
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: orbe-ledger
      POSTGRES_USER: orbe-ledger
      POSTGRES_DB: main-ledger
    ports:
      - 5432:5432
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbe-ledger"]
      interval: 10s
      timeout: 5s
      retries: 5

