  orbe-services:
    container_name: orbe-services
    build:
      context: ./orbe-services
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: orbe-services
      DB_PASSWORD: orbe-services
      DB_NAME: orbe-services
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:3001/orbe-services/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  orbe-ledger:
    container_name: orbe-ledger
    build:
      context: ./orbe-ledger
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: orbe-ledger
      DB_PASSWORD: orbe-ledger
      DB_NAME: orbe-ledger
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:3000/orbe-ledger/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # spi-simulator:
  #   container_name: spi-simulator
  #   build:
  #     context: ./spi-simulator
