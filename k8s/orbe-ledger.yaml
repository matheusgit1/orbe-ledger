apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbe-ledger
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbe-ledger
  template:
    metadata:
      labels:
        app: orbe-ledger
    spec:
      containers:
      - name: orbe-ledger
        image: orbe-ledger:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: orbe-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: orbe-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: orbe-secret
              key: ORBE_LEDGER_DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orbe-secret
              key: ORBE_LEDGER_DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: orbe-secret
              key: ORBE_LEDGER_DB_NAME
        - name: DB_LOGGING
          value: "false"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /orbe-ledger/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /orbe-ledger/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orbe-ledger-service
  namespace: default
spec:
  selector:
    app: orbe-ledger
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
