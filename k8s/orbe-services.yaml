apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbe-taxes
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbe-taxes
  template:
    metadata:
      labels:
        app: orbe-taxes
    spec:
      containers:
        - name: orbe-taxes
          image: orbe-taxes:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: orbe-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: orbe-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: orbe-secret
                  key: ORBE_SERVICES_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbe-secret
                  key: ORBE_SERVICES_DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: orbe-secret
                  key: ORBE_SERVICES_DB_NAME
            - name: DB_LOGGING
              value: "false"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /orbe-taxes/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /orbe-taxes/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orbe-taxes-service
  namespace: default
spec:
  selector:
    app: orbe-taxes
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
