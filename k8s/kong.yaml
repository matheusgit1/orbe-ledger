apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.9.1
          ports:
            - containerPort: 8000
            - containerPort: 8443
            - containerPort: 8001
          env:
            - name: KONG_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: orbe-config
                  key: KONG_DATABASE
            - name: KONG_DECLARATIVE_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: orbe-config
                  key: KONG_DECLARATIVE_CONFIG
            - name: KONG_PROXY_ACCESS_LOG
              valueFrom:
                configMapKeyRef:
                  name: orbe-config
                  key: KONG_PROXY_ACCESS_LOG
            - name: KONG_ADMIN_ACCESS_LOG
              valueFrom:
                configMapKeyRef:
                  name: orbe-config
                  key: KONG_ADMIN_ACCESS_LOG
            - name: KONG_PROXY_ERROR_LOG
              valueFrom:
                configMapKeyRef:
                  name: orbe-config
                  key: KONG_PROXY_ERROR_LOG
            - name: KONG_ADMIN_ERROR_LOG
              valueFrom:
                configMapKeyRef:
                  name: orbe-config
                  key: KONG_ADMIN_ERROR_LOG
            - name: KONG_ADMIN_LISTEN
              valueFrom:
                configMapKeyRef:
                  name: orbe-config
                  key: KONG_ADMIN_LISTEN
          volumeMounts:
            - name: kong-config
              mountPath: /kong
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - kong
                - health
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - kong
                - health
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-service
  namespace: default
spec:
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: 30080
    - name: proxy-ssl
      port: 8443
      targetPort: 8443
      nodePort: 30443
    - name: admin
      port: 8001
      targetPort: 8001
      nodePort: 30081
  type: NodePort
